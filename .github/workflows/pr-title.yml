name: PR title

# Releases are computed from the commit messages on main, and a squash merge
# uses the pull request title as the commit message: it must follow
# Conventional Commits (feat: …, fix: …, docs: …). See CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            ci
            chore
          requireScope: false
