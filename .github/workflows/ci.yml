name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version
      - run: shellcheck -x -S warning bin/bashx $(git ls-files '*.sh' '*.bash')

  # The command (cmd/bashx): format, vet, unit tests.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd)" || { gofmt -l cmd; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # The suite runs a binary built with -cover: it measures the Go code the
  # bash tests reach, next to the bash line coverage.
  test:
    name: test (ubuntu, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build -cover -o .build/bashx-cover ./cmd/bashx && mkdir -p .build/gocov
      - run: bin/bashx test --coverage=coverage --report=junit
        env:
          BASHX_BIN: ${{ github.workspace }}/.build/bashx-cover
          GOCOVERDIR: ${{ github.workspace }}/.build/gocov
      - name: Coverage summary
        if: always()
        run: |
          {
            bin/bashx coverage report -x '^examples/' -f markdown coverage/covered.tsv
            echo
            echo '| Script | Covered | Coverable |'
            echo '| --- | ---: | ---: |'
            bin/bashx coverage report -x '^examples/' -f tsv coverage/covered.tsv | tail -n +2 | sort | awk -F'\t' '{ printf "| `%s` | %d | %d |\n", $1, $2, $3 }'
            echo
            echo "**Go coverage:** $(go tool covdata percent -i .build/gocov | awk '{ print $NF }') of statements"
          } >>"${GITHUB_STEP_SUMMARY}"

  # The minimum bash version bashx supports, and the ones after it, on the
  # official bash images (Alpine: busybox tools plus the packages bashx needs).
  bash-versions:
    name: test (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ["5.0", "5.1", "5.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Static: it runs on Alpine's musl as it is.
      - run: CGO_ENABLED=0 go build -o .build/bashx ./cmd/bashx
      - name: Tests in bash:${{ matrix.bash }}
        run: |
          docker run --rm --init -v "${PWD}:/src" -w /src -e BASHX_BIN=/src/.build/bashx "bash:${{ matrix.bash }}" sh -euc '
            apk add --no-cache coreutils curl findutils git procps >/dev/null
            git config --global --add safe.directory /src
            bash --version | head -1
            CI=1 bash bin/bashx test
          '

  macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: brew install bash coreutils
      - name: Tests
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix)/bin:${PATH}"
          bash --version | head -1
          bin/bashx test

  mutation:
    name: mutation (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: bin/bashx mutate examples/calculator/calc.sh >>"${GITHUB_STEP_SUMMARY}"
