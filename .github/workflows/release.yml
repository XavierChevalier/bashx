name: Release

# On every push to main, release-please keeps a "chore: release X.Y.Z" pull
# request up to date: next version from the commit messages (Conventional
# Commits), CHANGELOG.md section, version in cmd/bashx/version.go and the docs. Merging
# that pull request tags vX.Y.Z and publishes the GitHub release with its
# changelog section; the job below builds the binary of every platform and
# attaches it with its .sha256.
# See CONTRIBUTING.md#releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal token lets the release pull request trigger CI; the
          # default token cannot (GitHub blocks workflow chains it starts).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check the released version
        run: test "$(go run ./cmd/bashx version)" = "bashx ${{ needs.release-please.outputs.version }}"
      # The test API is embedded: each binary is all a user installs.
      - name: Build the binaries
        run: |
          mkdir -p dist
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            CGO_ENABLED=0 GOOS="${platform%-*}" GOARCH="${platform#*-}" go build -trimpath -ldflags "-s -w" \
              -o "dist/bashx-${platform}" ./cmd/bashx
            (cd dist && sha256sum "bashx-${platform}" >"bashx-${platform}.sha256")
          done
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/bashx-* --clobber
